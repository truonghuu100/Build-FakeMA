name: Compile C++ DLL
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download MinHook Source
        run: git clone https://github.com/TsudaKageyu/minhook.git
        
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          
      - name: Compile DLL
        shell: cmd
        run: |
          cl.exe /O2 /LD /EHsc FakeMAC.cpp minhook\src\buffer.c minhook\src\hook.c minhook\src\trampoline.c minhook\src\hde\hde32.c minhook\src\hde\hde64.c /I "minhook\include" iphlpapi.lib /link /OUT:FakeMAC.dll /MACHINE:X86
          
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: FakeMAC-DLL
          path: FakeMAC.dll
