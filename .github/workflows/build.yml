name: Compile C++ DLL
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install MinHook via vcpkg
        run: vcpkg install minhook:x86-windows
        
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          
      - name: Compile DLL
        shell: cmd
        run: |
          cl.exe /O2 /LD /EHsc FakeMAC.cpp /I "%VCPKG_INSTALLATION_ROOT%\packages\minhook_x86-windows\include" "%VCPKG_INSTALLATION_ROOT%\packages\minhook_x86-windows\lib\minhook.lib" iphlpapi.lib /link /OUT:FakeMAC.dll /MACHINE:X86
          
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: FakeMAC-DLL
          path: FakeMAC.dll
